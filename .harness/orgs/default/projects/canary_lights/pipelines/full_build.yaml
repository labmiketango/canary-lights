pipeline:
  stages:
    - id: goBuildTestHostedLinuxStage_1
      name: Go Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: parallel_group_12cb
          id: parallel_group_12cb
          parallel:
            steps:
              - id: setupGo
                name: Setup Go
                template:
                  uses: setupGo@1.0.0
              - name: Update OS Prereqs
                run:
                  script: |-
                    apt update
                    apt install libusb-1.0-0
                    apt install libusb-1.0-0-dev
                id: Update_OS_Prereqs
        - id: downloadDependenciesLinux
          name: Download Dependencies on Linux
          run:
            shell: bash
            script: |-
              go mod download
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              # Install JUnit reporter
              go install github.com/jstemmer/go-junit-report/v2@latest
              export PATH="$(go env GOPATH)/bin:$PATH"
              # Run tests with coverage and convert to JUnit
              set -o pipefail
              go test -v -coverprofile=coverage.out ./... 2>&1 | go-junit-report -set-exit-code > report.xml
            intelligence:
              disabled: true
        - id: coverage
          name: Upload Coverage
          run:
            shell: bash
            script: |-
              hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: |-
              go build -v ./...
            
