pipeline:
  stages:
    - id: goBuildTestHostedLinuxStage_1
      name: Go Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Prepare Environment
          id: Prepare_Environment
          parallel:
            steps:
              - id: setupGo
                name: Setup Go
                template:
                  uses: setupGo@1.0.0
              - name: Update OS Prereqs
                run:
                  script: |-
                    #apt update
                    apt install libusb-1.0-0
                    #apt install libusb-1.0-0-dev
                id: Update_OS_Prereqs
        - id: downloadDependenciesLinux
          name: Download Dependencies on Linux
          run:
            shell: bash
            script: go mod download
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: go build -v ./...
        - id: venLinux
          name: Go Vet
          run:
            shell: bash
            script: go vet ./...
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              # Install JUnit reporter
              go install github.com/jstemmer/go-junit-report/v2@latest
              export PATH="$(go env GOPATH)/bin:$PATH"
              # Run tests with coverage and convert to JUnit
              set -o pipefail
              go test -v -coverprofile=coverage.out ./... 2>&1 | go-junit-report -set-exit-code > report.xml
            intelligence:
              disabled: true
        - id: coverage
          name: Upload Coverage
          run:
            shell: bash
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
        - name: Security
          id: Security
          group:
            steps:
              - name: Code Scanner
                id: Code_Scanner
                parallel:
                  steps:
                    - name: Semgrep Scan
                      id: Semgrep_Scan
                      sto:
                        uses: semgrepStep
                        with:
                          mode: orchestration
                          configuration: default
                          type: repository
                          detection: auto
                          workspace: /harness
                          log_level: info
                          registry: account.harnessImage
                          tag: latest
                          pull_policy: always
                    - name: Mythos Agent
                      id: Mythos_Agent
                      sto:
                        uses: mythosAgentStep
                        with:
                          mode: orchestration
                          configuration: scan
                          type: repository
                          detection: auto
                          workspace: /harness
                          log_level: info
                          registry: account.harnessImage
                          tag: latest
                          pull_policy: always
        - name: Remediate Vulernabilities
          id: Remediate_Vulernabilities
          template:
            uses: avra
            with:
              llm_connector: connector_OpenAI_84f9
              model_name: rbrisita/qwen3-coder:ud-q4_K_XL
              validation_pipeline_id: security_scan
              max_prs: 2
              harness_base_url: https://app.harness.io
              harness_token_secret: harnessoauthaccesstoken_github_1792742955337
